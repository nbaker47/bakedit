[package]
name = "bakedit-git"
description = "Git backend over the git command line: status, diff, stage, commit, permalinks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
similar.workspace = true
thiserror.workspace = true
log.workspace = true
libc.workspace = true

# Only macOS git rewrites decomposed file names; see src/precompose.rs.
[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile.workspace = true
