[package]
name = "bakedit"
description = "A lean terminal IDE modelled on Zed"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "bakedit"
path = "src/lib.rs"

[[bin]]
name = "bakedit"
path = "src/main.rs"

[dependencies]
bakedit-core.workspace = true
bakedit-input.workspace = true
bakedit-keymap.workspace = true
bakedit-text.workspace = true
bakedit-syntax.workspace = true
bakedit-term.workspace = true
bakedit-git.workspace = true
bakedit-project.workspace = true
bakedit-herdr.workspace = true
anyhow.workspace = true
arboard.workspace = true
crossbeam-channel.workspace = true
crossterm.workspace = true
dirs.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
nucleo-matcher.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
bakedit-herdr = { workspace = true, features = ["mock"] }
tempfile.workspace = true
