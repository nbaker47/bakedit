[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
bakedit-core = { path = "crates/core" }
bakedit-input = { path = "crates/input" }
bakedit-keymap = { path = "crates/keymap" }
bakedit-text = { path = "crates/text" }
bakedit-syntax = { path = "crates/syntax" }
bakedit-term = { path = "crates/term" }
bakedit-git = { path = "crates/git" }
bakedit-project = { path = "crates/project" }
bakedit-herdr = { path = "crates/herdr" }

alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3"
bitflags = "2"
crossbeam-channel = "0.5"
crossterm = "0.29"
dirs = "7"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
libc = "0.2"
log = "0.4"
memchr = "2"
notify = "9"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
similar = "3"
tempfile = "3"
thiserror = "2"
trash = "5"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
